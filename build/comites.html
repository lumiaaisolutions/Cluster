  <style>
    :root {
      /* Primary Colors - Inspired by Porsche */
      --porsche-black: #09090b;
      --porsche-charcoal: #2d2d2d;
      --porsche-silver: #8a8a8a;
      --porsche-white: #ffffff;
      --porsche-light-gray: #f5f5f5;
      --porsche-accent: #C7252B;

      /* Typography */
      --porsche-font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --porsche-font-weight-light: 300;
      --porsche-font-weight-regular: 400;
      --porsche-font-weight-medium: 500;
      --porsche-font-weight-semibold: 600;
      --porsche-font-weight-bold: 700;

      /* Spacing & Layout */
      --space-1: 0.25rem;
      --space-2: 0.5rem;
      --space-3: 0.75rem;
      --space-4: 1rem;
      --space-6: 1.5rem;
      --space-8: 2rem;
      --space-12: 3rem;
      --radius-lg: 12px;
      --porsche-radius-lg: 12px;
      --transition-fast: 0.2s ease;
      --transition-normal: 0.3s ease;
      
      /* Shadows */
      --porsche-shadow-subtle: 0 1px 3px rgba(0, 0, 0, 0.06);
      --porsche-shadow-medium: 0 4px 12px rgba(0, 0, 0, 0.08);
      --porsche-shadow-large: 0 8px 32px rgba(0, 0, 0, 0.12);
    }

    /* Global Typography Enhancement */
    * {
      font-family: var(--porsche-font) !important;
      box-sizing: border-box !important;
    }

    body {
      font-weight: var(--porsche-font-weight-regular);
      line-height: 1.6;
      letter-spacing: -0.01em;
      background-color: black;
      color: #f3f4f6; /* text-gray-100 */
      overflow-x: hidden !important;
      max-width: 100vw !important;
      min-height: 100vh;
    }

    /* Anti-scroll horizontal rules */
    html {
      overflow-x: hidden !important;
    }

    /* Estilos responsivos de la barra y contenido */
    @media (min-width: 1025px) {
      .porsche-navbar-responsive {
        margin: 80px 120px 16px 120px !important;
      }
      .claut-main-responsive {
        padding: var(--space-4) var(--space-12) 0 var(--space-12) !important;
      }
    }

    @media (max-width: 1024px) {
      .porsche-navbar-responsive {
        margin: 80px 24px 16px 24px !important;
      }
      .claut-main-responsive {
        padding: var(--space-4) var(--space-4) 0 var(--space-4) !important;
      }
    }

    @media (max-width: 768px) {
      .porsche-navbar-responsive {
        margin: 70px 10px 10px 10px !important;
        padding: 0.5rem !important;
      }
      .claut-main-responsive {
        padding: var(--space-2) var(--space-2) 0 var(--space-2) !important;
      }
    }

    /* Fix para alineación de header */
    .claut-header {
      padding: 0 40px !important;
      position: fixed !important;
      width: 100% !important;
      display: flex !important;
      justify-content: space-between !important;
      align-items: center !important;
      z-index: 1000 !important;
    }

    @media (min-width: 1025px) {
      .claut-header-nav {
        position: absolute !important;
        left: 50% !important;
        top: 50% !important;
        transform: translate(-50%, -50%) !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        flex: none !important;
        margin: 0 !important;
        width: auto !important;
      }
    }

    .claut-header-actions {
      display: flex !important;
      justify-content: flex-end !important;
      min-width: 120px !important;
    }

    .claut-header-btn {
      display: flex !important;
      visibility: visible !important;
      opacity: 1 !important;
    }

    .claut-nav-item {
      padding: 6px 12px !important;
      white-space: nowrap;
    }

    /* Porsche-inspired Card System for Comites */
    .porsche-card {
      background: var(--porsche-white);
      border-radius: var(--porsche-radius-lg);
      box-shadow: var(--porsche-shadow-medium);
      border: 1px solid rgba(0, 0, 0, 0.04);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
    }

    .porsche-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--porsche-accent), var(--porsche-charcoal));
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .porsche-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--porsche-shadow-large);
    }

    .porsche-card:hover::before {
      opacity: 1;
    }

    /* Breadcrumb styling */
    .breadcrumb {
      background: transparent !important;
      padding: var(--porsche-space-sm) 0;
    }

    .breadcrumb a {
      color: var(--porsche-white) !important;
      opacity: 0.8 !important;
      text-decoration: none;
      transition: opacity 0.3s ease;
    }

    .breadcrumb a:hover {
      opacity: 1 !important;
    }

    .breadcrumb li {
      color: var(--porsche-white) !important;
      font-weight: var(--porsche-font-weight-medium);
    }

    .breadcrumb .breadcrumb-title {
      color: white !important;
      font-weight: var(--porsche-font-weight-bold);
      margin-top: 0.5rem; /* var(--porsche-space-xs) */
    }

    /* Animations */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    @keyframes slideIn {
      from { transform: translateX(-100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    .card-animate { animation: fadeInUp 0.6s ease-out forwards; }

    .card-hover {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .card-hover:hover {
      transform: translateY(-8px) scale(1.02);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    }

    /* Logo & UI Elements */
    .logo-container {
      position: relative;
      overflow: hidden;
    }

    .logo-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(45deg, transparent 30%, rgba(255, 255, 255, 0.1) 50%, transparent 70%);
      transform: translateX(-100%);
      transition: transform 0.6s;
    }

    .card-hover:hover .logo-container::before { transform: translateX(100%); }

    .circle-logo {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.3);
      transition: all 0.3s ease;
    }

    .card-hover:hover .circle-logo {
      border-color: rgba(255, 255, 255, 0.6);
      transform: rotate(360deg);
    }

    .btn-join {
      position: relative;
      overflow: hidden;
      z-index: 1;
    }

    .btn-join::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: left 0.5s;
      z-index: -1;
    }

    .btn-join:hover::before { left: 100%; }

    /* Restricted Access Overlay */
    .restricted-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      border-radius: inherit;
      backdrop-filter: blur(5px);
    }

    .restricted-message {
      background: white;
      padding: 2rem;
      border-radius: 1rem;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
      max-width: 300px;
    }

    /* Image Handling */
    .comite-image-container {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
    }

    .comite-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: all 0.3s ease;
      opacity: 0;
    }

    .comite-image.loaded { opacity: 1; }
    
    .image-fallback {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .image-fallback.show { opacity: 1; }

    /* FontAwesome fixes restorados */
    .fa, .fas, .far, .fal, .fab {
      font-family: "Font Awesome 6 Free", "Font Awesome 6 Pro", "FontAwesome" !important;
      font-weight: 900 !important;
    }

    /* ============================================================
       RESPONSIVE MASTER — comites.html
    ============================================================ */
    html, body {
      max-width: 100vw !important;
      overflow-x: hidden !important;
    }

    /* --- Main: padding responsive (la clase claut-main-responsive ya lo maneja por breakpoint) --- */
    main.claut-main {
      padding-top: calc(var(--header-height, 64px) + 1rem) !important;
      margin-top: 0 !important;
      margin-left: 0 !important;
      overflow-x: hidden !important;
    }

    /* --- Header: padding responsivo en móvil --- */
    @media (max-width: 640px) {
      .claut-header { padding: 0 0.75rem !important; }
      main.claut-main { padding-top: calc(var(--header-height, 64px) + 1rem) !important; }
    }
    @media (min-width: 641px) and (max-width: 1024px) {
      .claut-header { padding: 0 1rem !important; }
    }

    /* --- Limitar padding desktop en claut-main-responsive --- */
    @media (min-width: 1025px) {
      .claut-main-responsive {
        padding-left: clamp(1rem, 4vw, 3rem) !important;
        padding-right: clamp(1rem, 4vw, 3rem) !important;
      }
    }

    /* --- Navbar sub-header: apilar en móvil --- */
    @media (max-width: 767px) {
      .porsche-navbar-responsive .flex.items-center.justify-between.w-full {
        flex-direction: column !important;
        align-items: flex-start !important;
        gap: 0.25rem !important;
        padding: 0 0.5rem !important;
      }
      .breadcrumb { margin-right: 0 !important; }
    }

    /* --- Grid de comités: 1 col en xs --- */
    @media (max-width: 480px) {
      #comitesContainer {
        grid-template-columns: 1fr !important;
        gap: 1rem !important;
      }
    }

    /* --- Container principal: ajustar padding en móvil --- */
    @media (max-width: 767px) {
      .container.mx-auto.px-4.py-8 { padding: 0.5rem !important; }
    }

    /* --- Modal registro: responsivo en móvil --- */
    @media (max-width: 640px) {
      #registroModal .max-w-md {
        width: 95vw !important;
        margin: 0.5rem auto !important;
      }
      #registroModal .p-6 { padding: 1rem !important; }
    }

    /* --- Mobile menu button --- */
    .claut-mobile-menu-btn { display: none !important; }
    @media (max-width: 767px) {
      .claut-mobile-menu-btn { display: flex !important; }
    }

    /* Fix para alineación de header */
    .claut-header {
      padding: 0 40px;
      position: fixed !important;
      width: 100% !important;
      display: flex !important;
      justify-content: space-between !important;
      align-items: center !important;
      z-index: 1000 !important;
    }

    @media (min-width: 1025px) {
      .claut-header-nav {
        position: absolute !important;
        left: 50% !important;
        top: 50% !important;
        transform: translate(-50%, -50%) !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        flex: none !important;
        margin: 0 !important;
        width: auto !important;
      }
    }

    .claut-header-actions {
      display: flex !important;
      justify-content: flex-end !important;
      min-width: 120px !important;
    }

    .claut-header-btn {
      display: flex !important;
      visibility: visible !important;
      opacity: 1 !important;
    }

    .claut-nav-item {
      padding: 6px 12px !important;
      white-space: nowrap;
    }

    /* ============================================================
       MENÚ CURVO ANIMADO — CSS completo
    ============================================================ */
    .claut-bottom-nav {
      position: fixed !important;
      bottom: 0 !important;
      left: 50% !important;
      transform: translateX(-50%) !important;
      width: 95% !important;
      max-width: 600px !important;
      height: 70px !important;
      background: var(--claut-bg-surface, #252a32) !important;
      border-radius: 35px 35px 0 0 !important;
      border: 1px solid rgba(15,23,42,0.12) !important;
      border-bottom: none !important;
      box-shadow: 0 -10px 30px rgba(0,0,0,0.4) !important;
      z-index: 9999 !important;
      overflow: hidden !important;
      backdrop-filter: blur(20px) !important;
      -webkit-backdrop-filter: blur(20px) !important;
      margin: 0 !important;
      padding: 0 !important;
      display: none;
    }
    .claut-bottom-nav::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 100%;
      background: linear-gradient(180deg, #252a32 0%, #2d333b 100%);
      opacity: 0.8; z-index: -1;
    }
    .claut-nav-container {
      position: relative !important; width: 100% !important; height: 100% !important;
      display: flex !important; align-items: center !important;
      justify-content: space-evenly !important; padding: 0 8px !important;
      box-sizing: border-box !important; overflow-x: auto !important;
      scrollbar-width: none !important; -ms-overflow-style: none !important;
    }
    .claut-nav-container::-webkit-scrollbar { display: none !important; }
    .claut-nav-link {
      position: relative !important; display: flex !important;
      flex-direction: column !important; align-items: center !important;
      justify-content: center !important; width: 48px !important;
      height: 48px !important; text-decoration: none !important;
      color: #94a3b8 !important;
      transition: all 0.4s cubic-bezier(0.68,-0.55,0.265,1.55) !important;
      border-radius: 50% !important; z-index: 2 !important;
      flex: 0 0 auto !important; margin: 0 2px !important;
    }
    .claut-nav-link i { font-size: 18px; transition: all 0.3s ease; }
    .claut-nav-link span {
      font-size: 9px; margin-top: 1px; opacity: 0;
      transform: translateY(10px); transition: all 0.3s ease; font-weight: 500;
    }
    .claut-nav-link.active { color: #C7252B !important; transform: translateY(-10px); }
    .claut-nav-link.active::before {
      content: ''; position: absolute; top: 50%; left: 50%;
      transform: translate(-50%,-50%); width: 50px; height: 50px;
      background: #C7252B; border-radius: 50%; z-index: -1;
      opacity: 0.2; animation: nav-pulse 2s infinite;
    }
    .claut-nav-link.active span { opacity: 1; transform: translateY(0); color: #C7252B; }
    .claut-nav-link:hover { color: #C7252B !important; transform: translateY(-5px) scale(1.1); }
    .claut-nav-link:hover span { opacity: 1; transform: translateY(0); }
    .claut-nav-curve {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%; pointer-events: none; z-index: 1;
    }
    .claut-nav-curve::before {
      content: ''; position: absolute; top: 0;
      left: var(--curve-position, 20%); width: 60px; height: 60px;
      background: #C7252B; border-radius: 50% 50% 0 0;
      transform: translateX(-50%) translateY(-30px);
      transition: all 0.4s cubic-bezier(0.68,-0.55,0.265,1.55);
      opacity: 0.1; box-shadow: 0 -5px 15px rgba(199,37,43,0.3);
    }
    @keyframes nav-pulse {
      0%   { transform: translate(-50%,-50%) scale(1);   opacity: 0.2; }
      50%  { transform: translate(-50%,-50%) scale(1.2); opacity: 0.1; }
      100% { transform: translate(-50%,-50%) scale(1);   opacity: 0.2; }
    }
    @media (max-width: 1024px) {
      .claut-bottom-nav { display: flex !important; }
      .claut-header-nav { display: none !important; }
      .claut-main, main { padding-bottom: 90px !important; }
    }
    @media (min-width: 1025px) {
      .claut-bottom-nav { display: none !important; }
      .claut-header-nav { display: flex !important; }
    }
    @media (max-width: 768px) {
      .claut-bottom-nav { width: 95%; height: 65px; }
      .claut-nav-link   { width: 55px; height: 55px; }
      .claut-nav-link i { font-size: 20px; }
    }
  </style>

        // ===== ENHANCED IMAGE HANDLING SYSTEM =====

        // Image retry tracking
        const imageRetryCount = new Map();
        const MAX_RETRIES = 3;
        const RETRY_DELAY = 1000; // 1 second

        // Simplified image loading function based on empresas-convenio.html pattern
        function createComiteImageElement(comite) {
          const img = document.createElement('img');
          // Sin object-fit ni altura forzada: las imágenes de comité tienen
          // contenido real hasta el borde (ícono, texto, logo del Clúster
          // abajo) — object-cover recortaba ese logo, object-contain con
          // altura fija dejaba franjas negras. La imagen define su propia
          // altura a partir de su proporción real, sin recortar nada.
          img.className = 'w-full h-auto block rounded-t-xl';
          img.alt = comite.nombre || 'Comité';

          // Generate dynamic placeholder as fallback (like empresas-convenio.html)
          const placeholderUrl = `https://ui-avatars.com/api/?name=${encodeURIComponent(comite.nombre || 'Comité')}&background=1a1a1a&color=C7252B&bold=true&length=2&size=300&font-size=0.33`;

          // Determine image URL with priority system
          let imageUrl = placeholderUrl; // Default fallback

          if (comite.imagen_url && comite.imagen_url.trim()) {
            // Use imagen_url if available
            imageUrl = comite.imagen_url;
          } else if (comite.tiene_imagen && comite.id) {
            // Use API endpoint if available
            imageUrl = `./api/comites.php?action=imagen&id=${comite.id}&t=${Date.now()}`;
          }

          img.src = imageUrl;

          // Handle loading errors with fallback
          img.onerror = function () {
            console.log(`Failed to load image for comité: ${comite.nombre}, using placeholder`);
            this.src = placeholderUrl;
            this.onerror = null; // Prevent infinite loop
          };

          return img;
        }

        // Enhanced fetch with retry mechanism and timeout
        async function fetchWithRetry(url, options = {}, maxRetries = 3) {
          const timeout = 10000; // 10 seconds timeout

          for (let i = 0; i <= maxRetries; i++) {
            try {
              console.log(`Attempting to fetch: ${url} (attempt ${i + 1})`);

              // Create timeout promise
              const timeoutPromise = new Promise((_, reject) => {
                setTimeout(() => reject(new Error('Request timeout')), timeout);
              });

              // Create fetch promise
              const fetchPromise = fetch(url, {
                ...options,
                cache: 'no-cache',
                headers: {
                  'Cache-Control': 'no-cache',
                  'Pragma': 'no-cache',
                  ...options.headers
                }
              });

              // Race between fetch and timeout
              const response = await Promise.race([fetchPromise, timeoutPromise]);

              if (!response.ok) {
                throw new Error(`HTTP ${response.status}: ${response.statusText}`);
              }

              console.log(`✅ Successfully fetched: ${url}`);
              return response;
            } catch (error) {
              console.log(`❌ Fetch attempt ${i + 1} failed:`, error.message);
              if (i === maxRetries) {
                throw error;
              }
              // Wait before retry (exponential backoff)
              await new Promise(resolve => setTimeout(resolve, 1000 * (i + 1)));
            }
          }
        }

        // Enhanced comites loading with better error handling
        async function loadComites() {
          const startTime = Date.now();
          console.log('🚀 Loading comités with enhanced error handling...');

          // Add loading timeout
          const loadingTimeout = setTimeout(() => {
            console.log('⏰ Loading timeout reached, showing error...');
            showError('La carga está tomando demasiado tiempo. Verifica tu conexión e intenta nuevamente.');
          }, 15000);

          try {
            const endpoints = [
              './api/comites.php?action=listar',
              './api/comites.php?action=listar',
              '/build/api/comites.php?action=listar'
            ];

            let lastError = null;
            let result = null;

            for (const endpoint of endpoints) {
              try {
                console.log(`🔄 Trying endpoint: ${endpoint}`);
                const response = await fetchWithRetry(endpoint, {}, 2); // Reduced retries
                result = await response.json();
                console.log(`✅ Successfully loaded from: ${endpoint}`);
                console.log('📊 Raw API response:', result);
                break;
              } catch (error) {
                console.log(`❌ Endpoint failed: ${endpoint}`, error.message);
                lastError = error;
                continue;
              }
            }

            // Clear the timeout since we got a response
            clearTimeout(loadingTimeout);

            if (!result) {
              throw lastError || new Error('All endpoints failed');
            }

            // Manejar diferentes formatos de respuesta de la API
            if (result.success || result.success === undefined) {
              const comites = result.comites || result.data || result.records || result || [];
              console.log('📋 Comités extracted:', comites);

              // Asegurar que tenemos un array
              const comitesArray = Array.isArray(comites) ? comites :
                (comites && typeof comites === 'object' ? Object.values(comites) : []);

              console.log(`⚡ Loading completed in ${Date.now() - startTime}ms`);
              renderComitesEnhanced(comitesArray);
            } else {
              showError('Error al cargar comités: ' + (result.message || result.error || 'Respuesta inválida'));
            }
          } catch (error) {
            clearTimeout(loadingTimeout);
            console.error('❌ Error loading comités:', error);
            showError('Error de conexión: ' + error.message);
          }
        }

  <!-- SISTEMA DE AUTENTICACIÓN -->
  <script>
    /**
     * Sistema de autenticación completo basado en sesiones PHP
     * Funciones principales para manejo de autenticación
     */

    // URL del endpoint de autenticación
    const AUTH_ENDPOINT = './api/auth/session.php';

    /**
     * Detectar y manejar la sesión del usuario
     */
    async function detectUserSession() {
      try {
        const response = await fetch(`${AUTH_ENDPOINT}?action=check`, {
          method: 'GET',
          credentials: 'include',
          headers: {
            'Content-Type': 'application/json',
          }
        });

        const result = await response.json();

        if (result.success && result.data) {
          displayUserInfo(result.data);
          return result.data;
        } else {
          showLoginPrompt();
          return null;
        }
      } catch (error) {
        console.error('Error al verificar sesión:', error);
        showLoginPrompt();
        return null;
      }
    }

    /**
     * Mostrar información del usuario en el sidebar y navbar
     */
    function displayUserInfo(userData) {
      console.log('📊 Mostrando información del usuario:', userData);

      // Establecer usuario globalmente
      window.currentUser = userData;

      // Extraer datos del usuario
      const nombre = userData.nombre || userData.name || userData.email || 'Usuario';
      const apellido = userData.apellido || userData.lastname || '';
      const nombreCompleto = apellido ? `${nombre} ${apellido}` : nombre;
      const empresa = userData.nombre_empresa || userData.empresa || 'Sin empresa';
      const email = userData.email || '';

      // Actualizar elementos del navbar (dropdown)
      const userDisplayName = document.getElementById('userDisplayName');
      const dropdownUserName = document.getElementById('dropdownUserName');
      const dropdownUserRole = document.getElementById('dropdownUserRole');

      if (userDisplayName) userDisplayName.textContent = nombreCompleto;
      if (dropdownUserName) dropdownUserName.textContent = nombreCompleto;
      if (dropdownUserRole) dropdownUserRole.textContent = empresa;

      // Actualizar elementos del sidebar (si existen)
      const userSection = document.getElementById('userSection');
      const loginSection = document.getElementById('loginSection');
      const userEmail = document.getElementById('userEmail');
      const userName = document.getElementById('userName');
      const userCompany = document.getElementById('userCompany');

      if (userSection && loginSection) {
        // Mostrar datos del usuario
        if (userEmail) userEmail.textContent = email;
        if (userName) userName.textContent = nombreCompleto;
        if (userCompany) userCompany.textContent = empresa;

        userSection.style.display = 'block';
        loginSection.style.display = 'none';
      }

      console.log('✅ Interfaz actualizada para usuario autenticado');
    }

    /**
     * Mostrar formulario de login
     */
    function showLoginPrompt() {
      const userSection = document.getElementById('userSection');
      const loginSection = document.getElementById('loginSection');

      if (userSection && loginSection) {
        userSection.style.display = 'none';
        loginSection.style.display = 'block';
      }
    }

    /**
     * Realizar login
     */
    async function performLogin() {
      const emailInput = document.getElementById('loginEmail');
      const passwordInput = document.getElementById('loginPassword');
      const loginError = document.getElementById('loginError');

      if (!emailInput || !passwordInput) {
        console.error('Campos de login no encontrados');
        return;
      }

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        if (loginError) {
          loginError.textContent = 'Por favor, completa todos los campos';
          loginError.style.display = 'block';
        }
        return;
      }

      try {
        const response = await fetch(`${AUTH_ENDPOINT}?action=login`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          credentials: 'include',
          body: JSON.stringify({ email, password })
        });

        const result = await response.json();

        if (result.success && result.data) {
          displayUserInfo(result.data);
          // Limpiar formulario
          emailInput.value = '';
          passwordInput.value = '';
          if (loginError) loginError.style.display = 'none';
        } else {
          if (loginError) {
            loginError.textContent = result.message || 'Credenciales incorrectas';
            loginError.style.display = 'block';
          }
        }
      } catch (error) {
        console.error('Error en login:', error);
        if (loginError) {
          loginError.textContent = 'Error de conexión. Intenta nuevamente.';
          loginError.style.display = 'block';
        }
      }
    }

    /**
     * Realizar logout
     */
    async function performLogout() {
      try {
        const response = await fetch(`${AUTH_ENDPOINT}?action=logout`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          credentials: 'include'
        });

        const result = await response.json();

        if (result.success) {
          showLoginPrompt();
        }
      } catch (error) {
        console.error('Error en logout:', error);
      }
    }

    // Inicializar detección de sesión al cargar la página
    document.addEventListener('DOMContentLoaded', function () {
      detectUserSession();

      // Configurar evento del botón de login
      const loginBtn = document.getElementById('loginBtn');
      if (loginBtn) {
        loginBtn.addEventListener('click', performLogin);
      }

      // Permitir login con Enter
      const loginEmail = document.getElementById('loginEmail');
      const loginPassword = document.getElementById('loginPassword');

      if (loginEmail) {
        loginEmail.addEventListener('keypress', function (e) {
          if (e.key === 'Enter') performLogin();
        });
      }

      if (loginPassword) {
        loginPassword.addEventListener('keypress', function (e) {
          if (e.key === 'Enter') performLogin();
        });
      }
      
    });
  </script>

  <!-- JavaScript for Mobile Responsive Sidebar -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const sidebar = document.querySelector('.porsche-sidebar');
      const overlay = document.querySelector('.sidenav-overlay');
      const menuToggle = document.querySelector('[sidenav-trigger]');
      const closeSidebarBtn = document.getElementById('closeSidebarBtn');

      let startX = 0;
      let currentX = 0;
      let isDragging = false;

      // Prevent body scroll when sidebar is open
      function preventBodyScroll(prevent) {
        if (prevent) {
          document.body.style.overflow = 'hidden';
          document.body.style.height = '100vh';
        } else {
          document.body.style.overflow = '';
          document.body.style.height = '';
        }
      }

      // Show sidebar
      function showSidebar() {
        if (sidebar) {
          sidebar.setAttribute('aria-expanded', 'true');
          sidebar.classList.add('sidenav-show');
          preventBodyScroll(true);
        }
        if (overlay) {
          overlay.classList.add('show');
        }
      }

      // Hide sidebar
      function hideSidebar() {
        if (sidebar) {
          sidebar.setAttribute('aria-expanded', 'false');
          sidebar.classList.remove('sidenav-show');
          preventBodyScroll(false);
        }
        if (overlay) {
          overlay.classList.remove('show');
        }
      }

      // Menu toggle button click
      if (menuToggle) {
        menuToggle.addEventListener('click', function (e) {
          e.preventDefault();
          e.stopPropagation();

          if (sidebar && sidebar.classList.contains('sidenav-show')) {
            hideSidebar();
          } else {
            showSidebar();
          }
        });
      }

      // Close button click
      if (closeSidebarBtn) {
        closeSidebarBtn.addEventListener('click', function (e) {
          e.preventDefault();
          e.stopPropagation();
          hideSidebar();
        });
      }

      // Overlay click
      if (overlay) {
        overlay.addEventListener('click', function () {
          hideSidebar();
        });
      }

      // Touch events for swipe gestures
      if (sidebar) {
        // Touch start
        sidebar.addEventListener('touchstart', function (e) {
          startX = e.touches[0].clientX;
          isDragging = true;
        }, { passive: true });

        // Touch move
        sidebar.addEventListener('touchmove', function (e) {
          if (!isDragging) return;
          currentX = e.touches[0].clientX;
          const deltaX = currentX - startX;

          // If swiping left more than 50px, close sidebar
          if (deltaX < -50) {
            hideSidebar();
            isDragging = false;
          }
        }, { passive: true });

        // Touch end
        sidebar.addEventListener('touchend', function () {
          isDragging = false;
        }, { passive: true });
      }

      // Handle window resize
      function handleResize() {
        if (window.innerWidth >= 1280) {
          // Desktop: ensure proper state
          if (sidebar) {
            sidebar.classList.remove('sidenav-show');
            sidebar.setAttribute('aria-expanded', 'false');
          }
          if (overlay) {
            overlay.classList.remove('show');
          }
          preventBodyScroll(false);
        }
      }

      // Debounced resize handler
      let resizeTimeout;
      window.addEventListener('resize', function () {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(handleResize, 150);
      });

      // Close sidebar on escape key
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && sidebar && sidebar.classList.contains('sidenav-show')) {
          hideSidebar();
        }
      });

      // Initial setup (removed sidebar code)
    });

    // Navigation JavaScript - Consistent across all pages
    document.addEventListener('DOMContentLoaded', function () {
      // Header navigation scroll effect
      const header = document.querySelector('.claut-header');
      const headerNav = document.querySelector('.claut-header-nav');

      if (header && headerNav) {
        let scrollTimer = null;

        window.addEventListener('scroll', function () {
          const scrollY = window.scrollY;

          if (scrollY > 50) {
            header.classList.add('scrolled');
          } else {
            header.classList.remove('scrolled');
          }

          clearTimeout(scrollTimer);
          scrollTimer = setTimeout(function () {
            header.classList.remove('scrolling');
          }, 150);

          header.classList.add('scrolling');
        });
      }

      // Synchronize header and bottom navigation
      const headerNavLinks = document.querySelectorAll('.claut-header-nav .claut-nav-item');
      const bottomNavLinks = document.querySelectorAll('.claut-bottom-nav .claut-nav-link');

      function syncNavigation(targetHref) {
        // Update header navigation
        headerNavLinks.forEach(link => {
          if (link.href.includes(targetHref)) {
            link.classList.add('active');
          } else {
            link.classList.remove('active');
          }
        });

        // Update bottom navigation
        bottomNavLinks.forEach(link => {
          if (link.href.includes(targetHref)) {
            link.classList.add('active');
          } else {
            link.classList.remove('active');
          }
        });
      }

      // Handle navigation clicks
      [...headerNavLinks, ...bottomNavLinks].forEach(link => {
        link.addEventListener('click', function (e) {
          const href = this.getAttribute('href');
          if (href && href !== '#') {
            syncNavigation(href);
          }
        });
      });

      // GSAP animations for navigation entrance
      if (typeof gsap !== 'undefined' && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        // Header navigation animation.
        // NOTA: antes usaba rotationY:-180 (flip 3D) — el frame intermedio
        // hacía ver el texto espejado. Un nav visto en cada navegación no
        // debe llevar animación vistosa (emil-design-eng: "tens of times/day
        // -> remove or drastically reduce").
        gsap.fromTo('.claut-header-nav .claut-nav-item', {
          opacity: 0,
          y: -8
        }, {
          opacity: 1,
          y: 0,
          duration: 0.3,
          stagger: 0.03,
          ease: "power2.out",
          delay: 0.05,
          clearProps: "all"
        });

      }

      // Bottom navigation touch interactions
      bottomNavLinks.forEach(link => {
        link.addEventListener('touchstart', function () {
          this.style.transform = 'scale(0.95)';
        });

        link.addEventListener('touchend', function () {
          this.style.transform = 'scale(1)';
        });
      });

      // Handle responsive navigation visibility
      function handleNavigationVisibility() {
        const header = document.querySelector('.claut-header');
        const bottomNav = document.querySelector('.claut-bottom-nav');

        if (window.innerWidth <= 1024) {
          if (header) header.style.display = 'none';
          if (bottomNav) bottomNav.style.display = 'block';
        } else {
          if (header) header.style.display = 'block';
          if (bottomNav) bottomNav.style.display = 'none';
        }
      }

      // Initial check
      handleNavigationVisibility();

      // Listen for resize events
      window.addEventListener('resize', handleNavigationVisibility);

      // Navigation item hover effects (desktop only)
      if (window.innerWidth > 1024) {
        headerNavLinks.forEach(item => {
          item.addEventListener('mouseenter', function () {
            this.style.transform = 'translateY(-2px)';
          });

          item.addEventListener('mouseleave', function () {
            this.style.transform = 'translateY(0)';
          });
        });
      }

      // Configuración del menú móvil
      function setupMobileMenu() {
        const mobileMenuBtn = document.getElementById('mobileMenuBtn');
        const headerNav = document.querySelector('.claut-header-nav');

        if (mobileMenuBtn && headerNav) {
          mobileMenuBtn.addEventListener('click', function () {
            headerNav.classList.toggle('show');

            // Cambiar ícono del botón
            const icon = this.querySelector('i');

              icon.className = 'fas fa-times';

    // JavaScript para el menú curvo animado
    document.addEventListener('DOMContentLoaded', function () {
      const bottomNavLinks = document.querySelectorAll('.claut-bottom-nav .claut-nav-link');
      const headerNavLinks = document.querySelectorAll('.claut-header-nav .claut-nav-item');
      const navCurve = document.querySelector('.claut-nav-curve');

      function setActiveNav(activeLink) {
        // Remover clase active de todos los enlaces del bottom nav
        bottomNavLinks.forEach(link => link.classList.remove('active'));

        // Agregar clase active al enlace clickeado
        activeLink.classList.add('active');

        // Posicionar la curva
        if (navCurve) {
          const linkIndex = Array.from(bottomNavLinks).indexOf(activeLink);
          const container = activeLink.closest('.claut-nav-container');
          const containerWidth = container.offsetWidth;
          const linkWidth = activeLink.offsetWidth;
          const leftOffset = (containerWidth / bottomNavLinks.length) * linkIndex + (linkWidth / 2);
          navCurve.style.left = leftOffset + 'px';
        }
      }

      // Event listeners para bottom nav
      bottomNavLinks.forEach((link, index) => {
        link.addEventListener('click', function (e) {
          e.preventDefault();

          // Solo hacer la animación, no navegar
          setActiveNav(link);

          // Navegar después de un pequeño delay para mostrar la animación
          setTimeout(() => {
            window.location.href = link.href;
          }, 150);
        });

        // Touch feedback para móviles
        link.addEventListener('touchstart', function () {
          link.style.transform = 'translateY(-12px) scale(0.95)';
        }, { passive: true });

        link.addEventListener('touchend', function () {
          setTimeout(() => {
            if (!link.classList.contains('active')) {
              link.style.transform = '';
            }
          }, 150);
        }, { passive: true });
      });

      // Event listeners para header nav
      headerNavLinks.forEach(link => {
        link.addEventListener('click', function (e) {
          // Remover active de todos
          headerNavLinks.forEach(item => item.classList.remove('active'));

          // Agregar active al clickeado
          link.classList.add('active');
        });
      });

      // Sincronizar navegación entre header y bottom nav
      function syncNavigation() {
        const currentPage = window.location.pathname.split('/').pop() || 'dashboard.html';

        // Remover todas las clases active
        bottomNavLinks.forEach(link => link.classList.remove('active'));
        headerNavLinks.forEach(link => link.classList.remove('active'));

        // Determinar cual debe estar activo basado en la página actual
        let activeBottomLink = null;
        let activeHeaderLink = null;

        if (currentPage.includes('dashboard')) {
          activeBottomLink = document.querySelector('.claut-bottom-nav .claut-nav-link[data-section="inicio"]');
          activeHeaderLink = document.querySelector('.claut-header-nav .claut-nav-item[href*="dashboard"]');
        } else if (currentPage.includes('descuentos')) {
          activeBottomLink = document.querySelector('.claut-bottom-nav .claut-nav-link[data-section="descuentos"]');
          activeHeaderLink = document.querySelector('.claut-header-nav .claut-nav-item[href*="descuentos"]');
        } else if (currentPage.includes('boletines')) {
          activeBottomLink = document.querySelector('.claut-bottom-nav .claut-nav-link[data-section="boletines"]');
          activeHeaderLink = document.querySelector('.claut-header-nav .claut-nav-item[href*="boletines"]');
        } else if (currentPage.includes('comite')) {
          activeBottomLink = document.querySelector('.claut-bottom-nav .claut-nav-link[data-section="comite"]');
          activeHeaderLink = document.querySelector('.claut-header-nav .claut-nav-item[href*="comite"]');
        } else if (currentPage.includes('contacto')) {
          activeBottomLink = document.querySelector('.claut-bottom-nav .claut-nav-link[data-section="contacto"]');
          activeHeaderLink = document.querySelector('.claut-header-nav .claut-nav-item[href*="contacto"]');
        } else if (currentPage.includes('eventos')) {
          activeBottomLink = document.querySelector('.claut-bottom-nav .claut-nav-link[data-section="eventos"]');
          activeHeaderLink = document.querySelector('.claut-header-nav .claut-nav-item[href*="eventos"]');
        } else if (currentPage.includes('convenio')) {
          activeBottomLink = document.querySelector('.claut-bottom-nav .claut-nav-link[data-section="convenios"]');
          activeHeaderLink = document.querySelector('.claut-header-nav .claut-nav-item[href*="convenio"]');
        }

        // Activar los enlaces correspondientes
        if (activeBottomLink) {
          activeBottomLink.classList.add('active');
          setActiveNav(activeBottomLink);
        }
        if (activeHeaderLink) {
          activeHeaderLink.classList.add('active');
        }
      }

      // Inicializar navegación sincronizada
      syncNavigation();

      // Animaciones de entrada solo si GSAP está disponible
      if (typeof gsap !== 'undefined') {
        // Animación de entrada del menú
        gsap.fromTo('.claut-bottom-nav', {
          y: 100,
          opacity: 0
        }, {
          y: 0,
          opacity: 1,
          duration: 0.8,
          ease: "back.out(1.7)",
          delay: 0.5
        });

        // Animación escalonada de los iconos
        gsap.fromTo('.claut-bottom-nav .claut-nav-link i', {
          scale: 0,
          rotation: -180
        }, {
          scale: 1,
          rotation: 0,
          duration: 0.6,
          ease: "back.out(2.5)",
          stagger: 0.1,
          delay: 1
        });
      }
    });
